services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: jalals
    volumes:
      - jalals_pg_data:/var/lib/postgresql/data

volumes:
  jalals_pg_data:
